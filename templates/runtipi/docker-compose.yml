services:
  mcmesh-gateway:
    image: ghcr.io/mcmesh/gatewayd:latest
    container_name: mcmesh-gateway
    restart: unless-stopped
    user: "10001:10001"
    ports:
      - ${APP_PORT}:8080
      - "9000:9000"
      - "25565:25565"
      - "24454:24454/udp"
    environment:
      MCMESH_AUTH: mojang,key
      MCMESH_RELAY: all
      MCMESH_RELAY_ADDR: 0.0.0.0:9000
      MCMESH_PUBLIC_ADDR: 0.0.0.0:25565
    volumes:
      - ${APP_DATA_DIR}/data:/data
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
